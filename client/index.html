<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6A1B9A" />
    <meta name="description" content="Peça seu açaí favorito com entrega rápida" />
    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pé de Açaí" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pré-conectar ao backend e Supabase para reduzir latência nas primeiras chamadas -->
    <link rel="preconnect" href="https://pedeacai.dream2app.com.br" />
    <link rel="dns-prefetch" href="https://pedeacai.dream2app.com.br" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/saco_acai.png" as="image" />
    <title>Pé de Açaí</title>
  </head>
  <body style="background:#EDE7F6">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
      history.scrollRestoration = 'manual';

      function updateHeaders() {
        var rootEl = document.getElementById('root');
        var scrolled = rootEl ? rootEl.scrollTop > 0 : false;
        document.querySelectorAll('.header').forEach(function(h) {
          h.classList.toggle('scrolled', scrolled);
        });
      }

      document.addEventListener('DOMContentLoaded', function() {
        var rootEl = document.getElementById('root');
        if (rootEl) {
          rootEl.addEventListener('scroll', updateHeaders, { passive: true });
          var observer = new MutationObserver(updateHeaders);
          observer.observe(rootEl, { childList: true, subtree: true });
        }
      });
    </script>
  </body>
</html>
