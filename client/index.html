<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6A1B9A" />
    <link rel="icon" type="image/png" href="/logo_placa.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <title>Pé de Açaí</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);

      function updateHeaders() {
        document.querySelectorAll('.header').forEach(function(h) {
          h.classList.toggle('scrolled', window.scrollY > 0);
        });
      }

      window.addEventListener('scroll', updateHeaders, { passive: true });
      updateHeaders();

      var rootEl = document.getElementById('root');
      if (rootEl) {
        var observer = new MutationObserver(updateHeaders);
        observer.observe(rootEl, { childList: true, subtree: true });
      }
    </script>
  </body>
</html>
