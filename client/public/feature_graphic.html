<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1024px; height: 500px; overflow: hidden; background: #000; }

    .banner {
      width: 1024px;
      height: 500px;
      background: linear-gradient(130deg, #0D0020 0%, #2A005A 38%, #5C0E9E 72%, #7B1FA2 100%);
      position: relative;
      overflow: hidden;
    }

    /* ── Blobs de luz ── */
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
    .blob-1 { width: 420px; height: 420px; background: rgba(138,43,226,0.28); top: -130px; right: 200px; }
    .blob-2 { width: 240px; height: 240px; background: rgba(60,0,120,0.65);   bottom: -60px; left: 30px; }
    .blob-3 { width: 200px; height: 200px; background: rgba(186,85,211,0.22); top: 50px; left: 370px; }

    /* ── Bolinhas decorativas ── */
    .dots { position: absolute; inset: 0; pointer-events: none; }

    /* ── Logomarca (placa com madeira) — canto superior esquerdo ── */
    .logo-sign {
      position: absolute;
      top: 20px;
      left: -20px;
      z-index: 10;
      width: 280px;
      height: 280px;
      object-fit: contain;
      transform: rotate(30deg);
      transform-origin: center center;
      filter: drop-shadow(-4px 8px 22px rgba(0,0,0,0.8));
    }

    /* ── Glow atrás dos produtos ── */
    .glow-products {
      position: absolute;
      left: 300px;
      top: 20px;
      width: 380px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(156,39,176,0.30) 0%, transparent 68%);
      z-index: 4;
      filter: blur(40px);
    }

    /* ── Farinha de Tapioca (atrás esquerda — overlap com açaí) ── */
    .farinha-tapioca {
      position: absolute;
      z-index: 5;
      bottom: 283px;
      left: 365px;
      width: 155px;
      height: 180px;
      object-fit: contain;
      transform: rotate(-10deg);
      filter: drop-shadow(-4px 10px 12px rgba(0,0,0,0.5)) brightness(0.82);
    }

    /* ── Saco de açaí (frente, centro) ── */
    .saco-acai {
      position: absolute;
      z-index: 7;
      bottom: 273px;
      left: 465px;
      width: 205px;
      height: 230px;
      object-fit: contain;
      transform: rotate(-2deg);
      filter: drop-shadow(-8px 16px 22px rgba(0,0,0,0.65)) drop-shadow(0 0 30px rgba(160,60,220,0.3));
    }

    /* ── Farinha d'Água (atrás direita — overlap com açaí) ── */
    .farinha-dagua {
      position: absolute;
      z-index: 5;
      bottom: 283px;
      left: 620px;
      width: 155px;
      height: 180px;
      object-fit: contain;
      transform: rotate(9deg);
      filter: drop-shadow(4px 10px 12px rgba(0,0,0,0.5)) brightness(0.82);
    }

    /* ── Texto inferior esquerdo ── */
    .bottom-left {
      position: absolute;
      left: 50px;
      bottom: 32px;
      z-index: 10;
    }
    .tagline {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 26px;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 18px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .tagline strong { color: #E1A8FF; font-style: italic; }

    .pills { display: flex; flex-direction: column; gap: 8px; }
    .pill {
      display: inline-flex;
      align-self: flex-start;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.11);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 100px;
      padding: 6px 16px;
      color: rgba(255,255,255,0.88);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 600;
    }

    /* ── Glow atrás do motoboy ── */
    .glow-moto {
      position: absolute;
      right: 0;
      bottom: -40px;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(156,39,176,0.28) 0%, transparent 68%);
      z-index: 6;
      filter: blur(40px);
    }

    /* ── Motoboy (direita) ── */
    /* ratio 1122:1402 → width=340 → height=425 */
    .motoboy {
      position: absolute;
      z-index: 9;
      bottom: -50px;
      right: -50px;
      width: 340px;
      height: 425px;
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(-18px 0 36px rgba(0,0,0,0.55));
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <svg class="dots" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
      <circle cx="36"  cy="48"  r="7"  fill="rgba(210,140,255,0.22)"/>
      <circle cx="58"  cy="68"  r="4"  fill="rgba(210,140,255,0.15)"/>
      <circle cx="20"  cy="82"  r="5"  fill="rgba(210,140,255,0.12)"/>
      <circle cx="44"  cy="432" r="8"  fill="rgba(210,140,255,0.18)"/>
      <circle cx="20"  cy="460" r="5"  fill="rgba(210,140,255,0.12)"/>
      <circle cx="966" cy="30"  r="8"  fill="rgba(210,140,255,0.18)"/>
      <circle cx="990" cy="52"  r="5"  fill="rgba(210,140,255,0.12)"/>
      <circle cx="538" cy="14"  r="4"  fill="rgba(210,140,255,0.14)"/>
      <circle cx="508" cy="487" r="5"  fill="rgba(210,140,255,0.12)"/>
    </svg>

    <!-- Logomarca (placa com madeira) -->
    <img src="vem_acai_fundo_transparente_real.png" alt="Vem, Açaí!" class="logo-sign"/>

    <!-- Glow produtos -->
    <div class="glow-products"></div>

    <!-- Farinha de Tapioca — atrás, esquerda do açaí -->
    <img src="farinha de tapioca.png" alt="Farinha de Tapioca" class="farinha-tapioca"/>

    <!-- Açaí — frente, centro -->
    <img src="saco_acai.png" alt="Açaí" class="saco-acai"/>

    <!-- Farinha d'Água — atrás direita do açaí -->
    <img src="./Farinha dagua.png" alt="Farinha d'Água" class="farinha-dagua"/>

    <!-- Glow motoboy -->
    <div class="glow-moto"></div>

    <!-- Motoboy inteiro, direita -->
    <img src="moto_cutout.png" alt="Entregador" class="motoboy"/>

    <!-- Texto + pills inferior esquerdo -->
    <div class="bottom-left">
      <div class="tagline">
        Açaí e acompanhamentos<br>
        <strong>na sua porta.</strong>
      </div>
      <div class="pills">
        <div class="pill">🏪 Belém · Manaus</div>
        <div class="pill">⚡ Pedido em segundos</div>
      </div>
    </div>
  </div>
</body>
</html>
