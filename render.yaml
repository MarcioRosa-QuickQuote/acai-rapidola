services:
  - type: web
    name: acai-rapidola
    env: node
    buildCommand: npm install && cd server && npm install && cd ../client && npm install && npm run build
    startCommand: node server/src/index.js
    envVars:
      - key: DATA_DIR
        value: /data
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: APP_URL
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
